<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>MoPress - $title$</title>
  <link rel="stylesheet" type="text/css" href="/styles/default.css" />
  <meta name="keywords" content="mopress,static site generator,static,site,generator,moonbit,blog" />
  <meta name="description" content="MoPress - A Static Site Generator in MoonBit." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <div id="main">
    <div id="header">
      <a href="/">
        MoPress
      </a>
    </div>
    <div id="sidebar">
      <h1>Navigation</h1>
      <a href="/index.html">home</a>
      <a href="/about.html">about</a>
      <a href="/posts/hello-world.html">blog</a>
      <a href="/contact.html">contact</a>
    </div>

    <div id="content">
      $if(reading_time)$
      <div class="post-meta">
        <span class="reading-time">&#x23F1; $reading_time$ min read</span>
        $if(word_count)$
        <span class="word-count">($word_count$ words)</span>
        $endif$
      </div>
      $endif$
      $body$
    </div>

    <div id="footer">
      Site proudly generated by <a href="https://github.com/biyuehu/mopress">MoPress</a>.
    </div>
  </div>
</body>

</html>
