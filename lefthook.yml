pre-commit:
  commands:
    logen:
      run: just logen
      stage_fixed: true
    prebuild:
      run: just prebuild
      stage_fixed: true
    format:
      run: moon fmt
      stage_fixed: true
    info:
      run: moon info
      stage_fixed: true
    test:
      run: moon test
      stage_fixed: true
    stage-generated:
      run: git add CHANGELOG.md docs/changelog.md src/includes.mbt docs/index.html "src/**/*.mbti"
      stage_fixed: false
